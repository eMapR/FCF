# Example configuration file for cross-platform use
# 
# IMPORTANT: Use forward slashes (/) for paths on both Windows and Linux
# R will automatically convert them to the correct format for your OS
#
# For absolute paths on Windows, use: C:/Users/username/data
# For absolute paths on Linux, use: /home/username/data
# For relative paths (recommended), use: ./data or ../data

site: black-mountains

# Use relative paths for portability (recommended).
# data_dir should be the parent directory that contains one folder per site.
# The program will look for:
#   data_dir/site/bnd/bnd.shp
#   data_dir/site/plots/plots.shp
#   data_dir/site/carbon-map.tif
data_dir: ./data
output_dir: ./results

# Or use absolute paths specific to your system:
# Windows example: C:/Users/username/bayesUpdate/data
# Linux example: /home/username/bayesUpdate/data

# Basic run settings that most users may change
n.samples: 5000
n.threads: 50

# Variogram diagnostic setting for Step 1
max.dist: 5

# Step 0 raster coverage guard.
# Leave strict.raster.coverage as true to stop when the raster does not fully cover
# the boundary extent. Set it to false to log a warning and continue.
# raster.coverage.tolerance is in the raster CRS units and allows small edge mismatches.
strict.raster.coverage: false
raster.coverage.tolerance: 10

# Advanced spatial prior settings
max.effective.range: 100
min.effective.range: 0.001

# Prior scales used by Step 2.
# These are more advanced settings and often should be adjusted only after Step 1.
spatial.variance.scale: 669.1625
nugget.variance.scale: 856.0102

# Advanced Step 2 starting values
starting.decay.rate: 1.5
starting.spatial.variance: 4000
starting.nugget.variance: 4000

# Advanced Step 2 tuning parameters
decay.rate.tuning: 0.06
spatial.variance.tuning: 0.06
nugget.variance.tuning: 0.06

# Chain processing
discard_offset: 60
chain_sample: 8
